[package]
name = "calldive"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI code review: entry-point driven, call-graph aware diffs"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
similar = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"

[profile.release]
lto = "thin"
