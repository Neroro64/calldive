[package]
name = "calldive"
version = "0.2.0"
edition = "2021"
description = "Interactive TUI code review: entry-point driven, call-graph aware diffs"
license = "MIT"

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
