[package]
name = "calldive"
version = "0.2.0"
edition = "2024"
description = "Interactive TUI code review: entry-point driven, call-graph aware diffs"
license = "MIT"

[dependencies]
aho-corasick = "1"
blake3 = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", features = ["inline", "unicode"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
test-case = "3"


# Syntect's regex/parse loops and tree-sitter/similar diffing are ~20x slower
# at opt-level 0; optimizing dependencies in dev keeps `cargo run` instant.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
debug = false
[profile.release]
lto = "thin"

[patch.crates-io]
syntect = { git = "https://github.com/tontinton/syntect", rev = "01df275f6f25da670e5ba5b7128cb89d03795119" }
